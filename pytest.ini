[pytest]
# Lives at the REPO ROOT (not backend/) so pytest discovers it no matter which
# directory you invoke `pytest` from. When the config sat in backend/, running from
# the repo root silently fell back to Mode.STRICT and SKIPPED every async test —
# and skipped tests still exit 0, which looks like a false "pass".

# asyncio_mode = auto lets `async def test_*` run without decorating each with
# @pytest.mark.asyncio — pytest-asyncio picks them up automatically.
asyncio_mode = auto
# Pin the async-fixture event-loop scope explicitly; pytest-asyncio warns (and will
# change its default) if this is left unset. "function" = a fresh loop per test.
asyncio_default_fixture_loop_scope = function

# testpaths is relative to this file's dir (the rootdir), so it works from anywhere.
testpaths = backend/tests

# pythonpath makes both import roots explicit instead of relying on pytest's implicit
# rootdir/cwd insertion: `backend` so `import app.*` resolves (the app package lives at
# backend/app), and `.` (the repo root) so `import eval.*` resolves (the eval package
# lives at repo-root/eval, next to this file). Both are prepended to sys.path at
# collection time. Added for Q4, which is the first code split across both roots.
pythonpath = . backend

# `live` marks tests that hit a REAL paid external API (e.g. Gemini embedding). They are
# opt-in: addopts DESELECTS them by default (not skips — a SKIP would read as a false
# green), so a plain `pytest` stays fast, offline, and "0 skipped". Run them explicitly
# with `pytest -m live` (the command-line -m overrides the one in addopts) and the
# required key set, e.g. GEMINI_API_KEY. They ERROR loudly, never skip, when selected.
markers =
    live: hits a real external API; opt-in, run with `-m live` and the API key set.
addopts = -m "not live"
